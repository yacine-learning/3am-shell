<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>3am shell: an on-call terminal game</title>
<meta name="description" content="On-call terminal game: learn Linux &amp; Docker troubleshooting by typing real commands into a simulated server.">
<meta name="theme-color" content="#0c0f12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="3am shell">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0f12; --bg2:#11161b; --panel:#151b21; --panel2:#1a2129; --line:#252e38; --line2:#2f3a46;
  --text:#dbe2e9; --muted:#8a97a4; --faint:#5d6976;
  --amber:#ffb547; --amber-d:#3a2a10; --green:#5ad68e; --green-d:#123222; --red:#ff6b6b; --red-d:#3a1717;
  --blue:#6cb6ff; --mag:#d68cff; --cyan:#4fd1c5; --yel:#f2d16b;
  --term:#090b0d;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
code{font-family:var(--mono);font-size:.88em;background:#0b0e11;border:1px solid var(--line);border-radius:4px;padding:.05em .35em;color:#e8edf2;white-space:nowrap}
[hidden]{display:none!important}
a{color:var(--blue)}

/* ---------- HOME ---------- */
#home{min-height:100%;background:
  radial-gradient(1200px 500px at 85% -10%,rgba(255,181,71,.10),transparent 60%),
  radial-gradient(900px 400px at -10% 110%,rgba(90,214,142,.07),transparent 60%),var(--bg)}
.wrap{max-width:1120px;margin:0 auto;padding:40px 24px 56px}
.page{display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:12px;color:var(--amber);letter-spacing:.06em;text-transform:uppercase;
  border:1px solid rgba(255,181,71,.35);background:rgba(255,181,71,.06);border-radius:999px;padding:6px 14px 6px 10px;width:max-content;max-width:100%}
.page .dot{width:8px;height:8px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 0 rgba(255,181,71,.7);animation:ping 1.6s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(255,181,71,.6)}80%,100%{box-shadow:0 0 0 10px rgba(255,181,71,0)}}
.homebar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.verbtn{flex:none;display:flex;align-items:center;gap:6px;background:none;border:1px solid var(--line2);border-radius:999px;padding:5px 10px;color:var(--muted);font-family:var(--mono);font-size:12px}
.verbtn:hover{color:var(--text);border-color:var(--muted)}
.verbtn svg{width:14px;height:14px}
.changelog{max-height:60vh;overflow:auto;margin:0 0 18px}
.changelog h4{margin:14px 0 4px;font-family:var(--mono);font-size:14px;color:var(--green)}
.changelog h4:first-child{margin-top:0}
.changelog h4 span{color:var(--faint);font-weight:400;font-size:12px;margin-left:6px}
.changelog ul{margin:0;padding-left:18px;color:var(--muted);font-size:13.5px;line-height:1.5}
h1.logo{font-family:var(--mono);font-weight:800;font-size:clamp(44px,8vw,84px);letter-spacing:-.04em;margin:22px 0 8px;line-height:.95}
h1.logo .cur{color:var(--green);animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.sub{font-size:17px;line-height:1.55;color:var(--muted);max-width:640px;margin:0}
.sub b{color:var(--text);font-weight:600}
.statbar{display:flex;flex-wrap:wrap;gap:10px;margin:26px 0 34px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:120px}
.stat .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-family:var(--mono)}
.stat .v{font-family:var(--mono);font-size:20px;font-weight:700;margin-top:2px}
.stat .v small{font-size:12px;color:var(--muted);font-weight:500}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:28px}
.col h3{font-family:var(--mono);font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 4px;color:var(--text);display:flex;align-items:center;gap:10px}
.col h3 .n{color:var(--faint);font-weight:500}
.col > p{margin:0 0 14px;color:var(--muted);font-size:14px;line-height:1.5}
.cards{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.card{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 14px;transition:border-color .15s,transform .15s,background .15s}
.card:hover:not(:disabled){border-color:var(--line2);background:var(--panel2);transform:translateX(2px)}
.card:disabled{cursor:not-allowed;opacity:.45}
.card .num{font-family:var(--mono);font-size:12px;color:var(--faint)}
.card .t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .s{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .r{font-family:var(--mono);font-size:12px;text-align:right;white-space:nowrap}
.card.done .r{color:var(--green)}
.card.next{border-color:rgba(90,214,142,.45);box-shadow:0 0 0 1px rgba(90,214,142,.15) inset}
.prio{font-family:var(--mono);font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:4px;letter-spacing:.04em;display:inline-block}
.prio.P1{background:var(--red-d);color:var(--red)} .prio.P2{background:var(--amber-d);color:var(--amber)}
.prio.P3{background:#132634;color:var(--blue)} .prio.P4{background:#1d232a;color:var(--muted)}
.lock{display:inline-block;width:12px;height:12px;vertical-align:-1px}
.foot{margin-top:40px;padding-top:20px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:16px 28px;justify-content:space-between;color:var(--muted);font-size:13.5px;line-height:1.55}
.foot .how{max-width:640px}
.linkbtn{background:none;border:1px solid var(--line2);border-radius:8px;padding:7px 12px;color:var(--muted);font-size:13px}
.linkbtn:hover{color:var(--text);border-color:var(--muted)}

/* ---------- PLAY ---------- */
#play{height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--bg)}
.topbar{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--bg2);flex:none}
.topbar .back{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-size:13px;font-family:var(--mono)}
.topbar .back:hover{border-color:var(--line2)}
.topbar .ttl{font-family:var(--mono);font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.topbar .ttl span{color:var(--faint);font-weight:500}
.topbar .chip{font-family:var(--mono);font-size:12px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 11px;white-space:nowrap}
.topbar .chip b{color:var(--amber)}
.toggle-panel{display:none}
.stage{flex:1;min-height:0;display:grid;grid-template-columns:400px minmax(0,1fr)}
.panel{border-right:1px solid var(--line);overflow-y:auto;padding:18px;background:var(--bg2);display:flex;flex-direction:column;gap:16px}
.panel > *{flex:none}

.ticket{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;position:relative;overflow:hidden}
.ticket.alert{border-color:rgba(255,107,107,.35)}
.ticket.alert::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--red)}
.tk-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.tk-head .id{color:var(--faint)}
.ticket h2{font-size:19px;margin:10px 0 8px;letter-spacing:-.01em}
.ticket p{margin:0;line-height:1.6;font-size:14.5px;color:#c6ced6}
.tk-tag{margin-top:12px;font-family:var(--mono);font-size:11px;color:var(--faint)}
.qbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.label{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
.label b{color:var(--amber);letter-spacing:.02em}
.qtext{font-weight:600;font-size:15px;line-height:1.45;margin:0 0 12px}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:center;text-align:left;background:#10151a;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:14px;line-height:1.35;transition:border-color .12s,background .12s}
.opt .l{font-family:var(--mono);font-size:12px;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;background:var(--panel2);color:var(--muted)}
.opt .v{word-break:break-word}
.opt:hover:not(:disabled){border-color:var(--line2)}
.opt.sel{border-color:var(--blue);background:#0f1a26}
.opt.sel .l{background:var(--blue);color:#06121e}
.opt.wrong{border-color:rgba(255,107,107,.5);background:var(--red-d);opacity:.7;text-decoration:line-through;cursor:not-allowed}
.opt.right{border-color:var(--green);background:var(--green-d)}
.opt.right .l{background:var(--green);color:#06150d}
.opt.mono .v{font-family:var(--mono);font-size:13px}
.submit{margin-top:12px;width:100%;background:var(--green);color:#07150d;border:0;border-radius:9px;padding:11px;font-weight:700;font-size:14px}
.submit:disabled{background:var(--panel2);color:var(--faint);cursor:not-allowed}
.feedback{margin-top:10px;font-size:13.5px;line-height:1.5;min-height:0}
.feedback.bad{color:var(--red)}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.hints{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.hints ol{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.55;color:#c6ced6}
.hints ol:empty{display:none}
.hintbtn{width:100%;background:transparent;border:1px dashed var(--line2);border-radius:9px;padding:9px;color:var(--amber);font-size:13.5px;font-weight:600}
.hintbtn:hover:not(:disabled){border-color:var(--amber);background:rgba(255,181,71,.05)}
.hintbtn:disabled{color:var(--faint);cursor:default}
.debrief{background:linear-gradient(180deg,rgba(90,214,142,.08),transparent 70%),var(--panel);border:1px solid rgba(90,214,142,.4);border-radius:12px;padding:16px}
.debrief h3{margin:0 0 6px;font-size:16px;color:var(--green);font-family:var(--mono)}
.debrief p{margin:0 0 12px;font-size:14px;line-height:1.6;color:#c6ced6}
.howto{margin:0 0 14px}
.howto .label{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
.howto .typeit{margin-top:8px;align-items:flex-start;overflow-wrap:anywhere}
.howto .typeit .pr{flex:none}
.howto .why{font-size:12.5px;color:var(--muted);line-height:1.45;margin:4px 2px 0}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{border-radius:9px;padding:9px 14px;font-weight:600;font-size:14px;border:1px solid var(--line2);background:var(--panel2)}
.btn.primary{background:var(--green);color:#07150d;border-color:transparent}
.btn:hover{filter:brightness(1.08)}
.note{font-size:12px;color:var(--faint);line-height:1.5;font-family:var(--mono)}

/* lesson */
.lhead .kicker{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.1em;text-transform:uppercase}
.lhead h2{margin:6px 0 12px;font-size:20px}
.bar{height:5px;background:var(--panel2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .3s}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.step{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 14px 14px 46px;position:relative;font-size:14.5px;line-height:1.55}
.step::before{content:attr(data-n);position:absolute;left:13px;top:13px;width:22px;height:22px;border-radius:50%;background:var(--panel2);color:var(--muted);font-family:var(--mono);font-size:11.5px;display:grid;place-items:center}
.step.done{opacity:.92}
.step.done::before{content:"✓";background:var(--green-d);color:var(--green)}
.step.cur{border-color:rgba(90,214,142,.5);box-shadow:0 0 0 3px rgba(90,214,142,.06)}
.step.cur::before{background:var(--green);color:#07150d}
.step .after{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line2);color:#b9c2cb;font-size:13.5px}
.typeit{margin-top:10px;display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--term);border:1px solid var(--line2);border-radius:8px;padding:9px 11px;font-family:var(--mono);font-size:13px;color:var(--green)}
.typeit:hover{border-color:var(--green)}
.typeit .pr{color:var(--faint)}
.typeit .go{margin-left:auto;font-size:11px;color:var(--faint);font-family:var(--sans);white-space:nowrap}
.step.done .typeit{display:none}

/* ---------- TERMINAL ---------- */
.termwrap{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--term)}
.tbar{display:flex;align-items:center;gap:7px;padding:8px 12px;border-bottom:1px solid #161b20;background:#0d1013;flex:none}
.tbar i{width:10px;height:10px;border-radius:50%;background:#2a3139}
.tbar i:nth-child(1){background:#ff5f57}.tbar i:nth-child(2){background:#febc2e}.tbar i:nth-child(3){background:#28c840}
.tbar .tt{flex:1;text-align:center;font-family:var(--mono);font-size:11.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbar button{background:none;border:1px solid #232a31;border-radius:6px;color:var(--faint);font-size:11px;font-family:var(--mono);padding:3px 7px}
.tbar button.on{color:var(--green);border-color:rgba(90,214,142,.4)}
.term{flex:1;min-height:0;overflow:auto;padding:12px 14px 6px;font-family:var(--mono);font-size:13px;line-height:1.5;cursor:text;-webkit-overflow-scrolling:touch}
.term .ln{white-space:pre;min-height:1.5em}
.term.wrap .ln{white-space:pre-wrap;word-break:break-all}
.term .ln.err{color:#ff8f8f}
.term .echo{color:#e9eef3}
.term .inrow{display:flex;align-items:baseline;white-space:pre}
.term .inrow input{flex:1;min-width:40px;background:transparent;border:0;outline:0;color:#f1f5f8;font:inherit;padding:0;margin:0;caret-color:var(--green)}
.p-user{color:var(--green);font-weight:700}.p-root{color:var(--red);font-weight:700}.p-path{color:var(--blue);font-weight:700}.p-sym{color:#e9eef3}
.term .b{font-weight:700}.term .dim{color:#6c7884}.term .red{color:#ff6b6b}.term .grn{color:#5ad68e}.term .yel{color:#f2d16b}.term .blu{color:#6cb6ff}.term .mag{color:#d68cff}.term .cyn{color:#4fd1c5}
.term .motd{color:#8a97a4}
.keys{display:none;gap:6px;padding:7px 8px;border-top:1px solid #161b20;background:#0d1013;overflow-x:auto;flex:none;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.keys::-webkit-scrollbar{display:none}
.keys button{flex:none;min-width:38px;height:36px;padding:0 10px;background:#161b21;border:1px solid #252d36;border-radius:7px;font-family:var(--mono);font-size:14px;color:#cfd7df;touch-action:manipulation}
.keys button.w{font-size:12px;color:var(--amber)}
.keys button:active{background:#232b34}

/* ---------- MODAL ---------- */
.modal{position:fixed;inset:0;background:rgba(5,7,9,.72);backdrop-filter:blur(3px);display:grid;place-items:center;padding:20px;z-index:50}
.mcard{background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:24px;max-width:440px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.mcard h3{margin:0 0 8px;font-size:20px}
.mcard p{margin:0 0 18px;color:var(--muted);line-height:1.55;font-size:14.5px}
.mcard .big{font-family:var(--mono);font-size:40px;font-weight:800;color:var(--green);margin:4px 0 6px}

/* ---------- RESPONSIVE ---------- */
@media (max-width: 1000px){ .stage{grid-template-columns:340px minmax(0,1fr)} }
@media (max-width: 860px){
  .cols{grid-template-columns:1fr}
  .wrap{padding:26px 16px 40px}
  .stage{display:flex;flex-direction:column}
  .panel{border-right:0;border-bottom:1px solid var(--line);max-height:44%;flex:none;padding:12px;gap:12px}
  .panel.collapsed{display:none}
  .toggle-panel{display:inline-block;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;font-family:var(--mono)}
  .termwrap{flex:1}
  .keys{display:flex}
  .term{font-size:12.5px;padding:10px 10px 4px}
  .topbar{padding:8px 10px;gap:8px}
  .topbar .chip{display:none}
  .ticket h2{font-size:17px}
  .tbar .tt{text-align:left}
}
@media (pointer:coarse){ .keys{display:flex} }
</style>
</head>
<body>

<section id="home"></section>

<section id="play" hidden>
  <div class="topbar">
    <button class="back" id="backBtn">← Menu</button>
    <div class="ttl" id="playTitle"></div>
    <button class="toggle-panel" id="togglePanel">Ticket ▾</button>
    <div class="chip" id="scoreChip"></div>
  </div>
  <div class="stage">
    <aside class="panel" id="panel"></aside>
    <div class="termwrap">
      <div class="tbar"><i></i><i></i><i></i><div class="tt" id="termTitle">devops@prod-web-01 — ssh</div><button id="wrapBtn" title="Wrap long lines">wrap</button></div>
      <div class="term" id="term">
        <div id="termOut"></div>
        <div class="inrow"><span id="termPrompt"></span><input id="termIn" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send" aria-label="Terminal input"></div>
      </div>
      <div class="keys" id="keys"></div>
    </div>
  </div>
</section>

<div class="modal" id="modal" hidden><div class="mcard" id="mcard"></div></div>

<script>/* 3am shell engine (bundled) */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.Engine = factory();
})(typeof self !== 'undefined' ? self : this, function () {
'use strict';
/* ===== core.js — utilities, virtual filesystem, parser, session ===== */
const NOW = Date.UTC(2026, 10, 9, 3, 12, 44);
const MIN = 60000, HOUR = 3600000, DAY = 86400000;
const K = 1024, M = K * K, G = M * K;
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const A = { dir: '\x1b[1;34m', exe: '\x1b[1;32m', arc: '\x1b[1;31m', red: '\x1b[1;31m', dim: '\x1b[2m', yel: '\x1b[33m', cyan: '\x1b[36m', grn: '\x1b[32m', bold: '\x1b[1m', R: '\x1b[0m' };

function rng(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const pad = (s, n) => String(s).padStart(n);
const padr = (s, n) => String(s).padEnd(n);
const stripAnsi = s => s.replace(/\x1b\[[0-9;]*m/g, '');

function human(n) {
  if (n < 1024) return String(Math.round(n));
  const units = ['K', 'M', 'G', 'T', 'P'];
  let v = n / 1024, u = 0;
  while (v >= 1024 && u < units.length - 1) { v /= 1024; u++; }
  if (v < 10) {
    const r = Math.ceil(v * 10 - 1e-9) / 10;
    if (r >= 10) return '10' + units[u];
    return r.toFixed(1) + units[u];
  }
  const r = Math.ceil(v - 1e-9);
  if (r >= 1024 && u < units.length - 1) return '1.0' + units[u + 1];
  return r + units[u];
}
function parseHuman(s) {

<script>(function () {
  'use strict';
  const { LESSONS, LEVELS } = window.CONTENT;
  const $ = (s, el) => (el || document).querySelector(s);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const BASE = 100, HINT_COST = 15, WRONG_COST = 20, MIN_PTS = 10;
  const MAX_SCORE = LEVELS.length * BASE;

  /* ---------- version + changelog (newest first; bump VERSION with each release to main) ---------- */
  const CHANGELOG = [
    { v: '1.3.0', date: '2026-11-12', notes: ['Version number on the menu; click it for this changelog.'] },
    { v: '1.2.0', date: '2026-11-12', notes: ['Back button stays in the app: closes popups, returns to the menu.', 'Mission debriefs list the commands that solve it, with common alternatives, click to type.'] },
    { v: '1.1.0', date: '2026-11-09', notes: ['Installable as an app, playable offline.'] },
    { v: '1.0.0', date: '2026-11-09', notes: ['First release: 8 training lessons, 17 on-call missions, simulated bash + Docker, hints, scoring and debriefs.'] }
  ];
  const VERSION = CHANGELOG[0].v;

  /* ---------- progress (per-browser convenience) ---------- */
  const KEY = 'rootcause.progress.v1';
  let memStore = null;
  function load() {
    try { const p = JSON.parse(localStorage.getItem(KEY) || 'null'); if (p && p.levels && p.lessons) return p; } catch (e) { if (memStore) return memStore; }
    return { lessons: {}, levels: {}, wrap: false };
  }
  let progress = load();
  function save() { memStore = progress; try { localStorage.setItem(KEY, JSON.stringify(progress)); } catch (e) { /* storage unavailable: keep in memory */ } }
  const totalScore = () => LEVELS.reduce((s, l) => s + ((progress.levels[l.id] || {}).best || 0), 0);
  const doneLevels = () => LEVELS.filter(l => progress.levels[l.id]).length;
  const doneLessons = () => LESSONS.filter(l => progress.lessons[l.id]).length;
  const levelUnlocked = i => i === 0 || !!progress.levels[LEVELS[i - 1].id];
  const lessonUnlocked = i => i === 0 || !!progress.lessons[LESSONS[i - 1].id];
  function rank(score) {
    if (score >= 1500) return '3am Legend';
    if (score >= 1100) return 'Senior SRE';
    if (score >= 700) return 'On-call Hero';
    if (score >= 300) return 'Junior SRE';
    return 'Intern';
  }

  /* ---------- ANSI → HTML ---------- */
  const ANSI = { 1: 'b', 2: 'dim', 31: 'red', 32: 'grn', 33: 'yel', 34: 'blu', 35: 'mag', 36: 'cyn' };
  function ansi(s) {
    let out = '', open = 0, last = 0, m;
    const re = /\x1b\[([0-9;]*)m/g;
    while ((m = re.exec(s))) {
      out += esc(s.slice(last, m.index)); last = re.lastIndex;
      const codes = m[1].split(';').filter(Boolean).map(Number);
      if (!codes.length || codes.includes(0)) { while (open) { out += '</span>'; open--; } continue; }
      const cls = codes.map(c => ANSI[c]).filter(Boolean).join(' ');
      if (cls) { out += `<span class="${cls}">`; open++; }
    }
    out += esc(s.slice(last));
    while (open) { out += '</span>'; open--; }
    return out;
  }

  /* ---------- terminal ---------- */
  const term = {
    el: $('#term'), out: $('#termOut'), input: $('#termIn'), promptEl: $('#termPrompt'),
    session: null, hist: [], hi: 0, onRun: null,
    attach(session) {
      this.session = session; this.out.innerHTML = ''; this.hist = []; this.hi = 0;
      this.motd(); this.renderPrompt();
    },
    motd() {
      if (isNarrow()) this.line(`<span class="motd">Welcome to Ubuntu 22.04.4 LTS

  System load:  2.41
  Usage of /:   44.7% of 48.27GB
  Memory usage: 63%

Last login: Mon Nov  9 02:51:07 2026</span>`);
      else this.line(`<span class="motd">Welcome to Ubuntu 22.04.4 LTS (GNU/Linux 5.15.0-125-generic x86_64)

  System load:  2.41               Processes:             213
  Usage of /:   44.7% of 48.27GB   Users logged in:       1
  Memory usage: 63%                IPv4 address for eth0: 10.0.4.21

Last login: Mon Nov  9 02:51:07 2026 from 10.0.4.12</span>`);
      this.line(`<span class="dim">Type <span class="grn">help</span> to list commands, <span class="grn">man ls</span> for a cheat-sheet.${isNarrow() ? '' : ' Tab completes, ↑ recalls.'}</span>`);
      this.line('');
    },
    promptHtml() {
      const p = this.session.prompt();
      if (p.busybox) return `<span class="p-path">${esc(p.path)}</span><span class="p-sym"> # </span>`;
      return `<span class="${p.root ? 'p-root' : 'p-user'}">${esc(p.user)}@${esc(p.host)}</span><span class="p-sym">:</span><span class="p-path">${esc(p.path)}</span><span class="p-sym">${p.sym} </span>`;
    },
    renderPrompt() {
      this.promptEl.innerHTML = this.promptHtml();
      const f = this.session.frame;
      $('#termTitle').textContent = f.m.kind === 'host' ? `${f.user}@prod-web-01 — ssh` : `docker exec -it ${f.m.name} ${f.shell || 'sh'}`;
    },
    line(html, cls) {
      const d = document.createElement('div');
      d.className = 'ln' + (cls ? ' ' + cls : '');
      d.innerHTML = html === '' ? '' : html;
      this.out.appendChild(d);
    },
    trim() { while (this.out.childNodes.length > 1500) this.out.removeChild(this.out.firstChild); },
    scroll() { this.el.scrollTop = this.el.scrollHeight; },
    echo(text, suffix) { this.line(this.promptHtml() + `<span class="echo">${esc(text)}</span>${suffix || ''}`); },
    run(text) {
      this.echo(text);
      if (text.trim()) { this.hist.push(text); }

      let r;
      try { r = this.session.run(text); }
      catch (e) { console.error(e); r = { chunks: [{ s: 'simulator error: ' + e.message + '\n', err: true }], cmds: [], code: 1 }; }
      if (r.clear) this.out.innerHTML = '';
      for (const c of r.chunks) {
        const s = c.s.endsWith('\n') ? c.s.slice(0, -1) : c.s;
        this.line(ansi(s), c.err ? 'err' : '');
      }
      this.trim(); this.renderPrompt(); this.scroll();
      if (this.onRun) this.onRun(text, r);
    },
    complete() {
      const v = this.input.value;
      const r = this.session.complete(v);
      if (r.options.length) {
        this.echo(v);
        const w = Math.max(...r.options.map(o => o.length)) + 2;
        const cols = Math.max(1, Math.floor((this.el.clientWidth - 28) / (w * 7.8)));
        let rows = '';
        r.options.forEach((o, i) => { rows += o.padEnd(w); if ((i + 1) % cols === 0) rows += '\n'; });
        this.line(esc(rows.trimEnd()));
        this.scroll();
      }
      this.input.value = r.line;
      this.caretEnd();
    },
    caretEnd() { const n = this.input.value.length; try { this.input.setSelectionRange(n, n); } catch (e) { } },
    histMove(d) {
      if (!this.hist.length) return;
      this.hi = Math.max(0, Math.min(this.hist.length, this.hi + d));
      this.input.value = this.hi === this.hist.length ? '' : this.hist[this.hi];
      this.caretEnd();
    },
    ctrlC() { this.echo(this.input.value, '<span class="dim">^C</span>'); this.input.value = ''; this.scroll(); },
    insert(t) {
      const i = this.input; const a = i.selectionStart ?? i.value.length, b = i.selectionEnd ?? i.value.length;
      i.value = i.value.slice(0, a) + t + i.value.slice(b);
      const n = a + t.length; try { i.setSelectionRange(n, n); } catch (e) { }
    },
    focus() { if (window.getSelection && String(window.getSelection())) return; this.input.focus({ preventScroll: true }); }
  };
  term.input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); const v = term.input.value; term.input.value = ''; term.run(v); return; }
    if (e.key === 'Tab') { e.preventDefault(); term.complete(); return; }
    if (e.key === 'ArrowUp') { e.preventDefault(); term.histMove(-1); return; }
    if (e.key === 'ArrowDown') { e.preventDefault(); term.histMove(1); return; }
    if (e.ctrlKey && (e.key === 'c' || e.key === 'C') && term.input.selectionStart === term.input.selectionEnd) { e.preventDefault(); term.ctrlC(); return; }
    if (e.ctrlKey && (e.key === 'l' || e.key === 'L')) { e.preventDefault(); term.out.innerHTML = ''; return; }
    if (e.ctrlKey && (e.key === 'u' || e.key === 'U')) { e.preventDefault(); term.input.value = ''; return; }
  });
  term.el.addEventListener('mouseup', () => term.focus());
  term.el.addEventListener('click', e => { if (e.target === term.el || e.target.closest('.inrow')) term.focus(); });

  /* mobile key row */
  const KEYS = [['Tab', 'w', () => term.complete()], ['↑', 'w', () => term.histMove(-1)], ['↓', 'w', () => term.histMove(1)], ['|'], ['-'], ['/'], ['~'], ['*'], ['>'], ['"'], ["'"], ['$'], ['.'], ['{'], ['}'], ['^C', 'w', () => term.ctrlC()]];
  const keysEl = $('#keys');

  });

  function applyWrap() { term.el.classList.toggle('wrap', !!progress.wrap); wrapBtn.classList.toggle('on', !!progress.wrap); }

  const isNarrow = () => window.matchMedia('(max-width: 860px)').matches;

  /* ---------- modal ---------- */
  function modal(html) { $('#mcard').innerHTML = html; $('#modal').hidden = false; enterApp(); const b = $('#mcard .btn.primary'); if (b) b.focus(); }

  /* ---------- back button ----------
     History holds the menu as its root entry plus at most one 'app' entry while a

  let skipPop = false;
  function enterApp() { if (!history.state || history.state.v !== 'app') history.pushState({ v: 'app' }, ''); }

  /* ---------- HOME ---------- */
  const LOCK = '<svg class="lock" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 015 0v2"/></svg>';
  function renderHome() {
    const score = totalScore();
    const nextLesson = LESSONS.findIndex(l => !progress.lessons[l.id]);
    const nextLevel = LEVELS.findIndex(l => !progress.levels[l.id]);
    $('#home').innerHTML = `
    <div class="wrap">
      <div class="homebar"><div class="page"><span class="dot"></span> 03:12 · prod-web-01 · you are on call</div>
        <button class="verbtn" id="verBtn" title="What's new" aria-label="Version ${VERSION}, show changelog"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 4h8M5 8h8M5 12h8"/><circle cx="2.2" cy="4" r=".6" fill="currentColor"/><circle cx="2.2" cy="8" r=".6" fill="currentColor"/><circle cx="2.2" cy="12" r=".6" fill="currentColor"/></svg>v${VERSION}</button></div>
      <h1 class="logo">3AM&nbsp;SHELL<span class="cur">_</span></h1>

          <ul class="cards">${LESSONS.map((l, i) => {
            const done = progress.lessons[l.id], un = lessonUnlocked(i);
            return `<li><button class="card ${done ? 'done' : ''} ${i === nextLesson ? 'next' : ''}" data-lesson="${i}" ${un ? '' : 'disabled'}>
              <span class="num">T${String(i + 1).padStart(2, '0')}</span>
              <span><div class="t">${esc(l.title)}</div><div class="s">${esc(l.blurb)}</div></span>
              <span class="r">${done ? '✓ done' : un ? l.steps.length + ' steps' : LOCK}</span></button></li>`;
          }).join('')}</ul>
        </section>
        <section class="col">
          <h3>On-call missions <span class="n">· ${LEVELS.length} incidents</span></h3>
          <p>Each mission unlocks the next. Hints cost ${HINT_COST} pts, wrong answers ${WRONG_COST} pts. The server is reset at the start of every mission.</p>
          <ul class="cards">${LEVELS.map((l, i) => {
            const rec = progress.levels[l.id], un = levelUnlocked(i);
            return `<li><button class="card ${rec ? 'done' : ''} ${i === nextLevel && un ? 'next' : ''}" data-level="${i}" ${un ? '' : 'disabled'}>
              <span class="num">M${String(i + 1).padStart(2, '0')}</span>
              <span><div class="t">${esc(l.title)}</div><div class="s"><span class="prio ${l.prio}">${l.prio}</span>&nbsp; ${un ? esc(l.tag) : 'locked'}</div></span>
              <span class="r">${rec ? '✓ ' + rec.best + ' pts' : un ? 'play →' : LOCK}</span></button></li>`;
          }).join('')}</ul>
        </section>
      </div>
      <div class="foot">
        <div class="how"><b style="color:var(--text)">How it works.</b> Every mission starts with a ticket from a colleague or an alert. Use the terminal to find the answer, pick it from the multiple-choice list, and the incident is closed. Each mission is worth up to ${BASE} pts; your best score per mission counts. The terminal emulates bash on Ubuntu 22.04 with Docker: pipes, redirection, globs, sudo, Tab completion and history all work. Progress is saved in this browser.</div>
        <div><button class="linkbtn" id="resetBtn">Reset progress</button></div>
      </div>
    </div>`;
    $('#home').querySelectorAll('[data-lesson]').forEach(b => b.addEventListener('click', () => startLesson(+b.dataset.lesson)));
    $('#home').querySelectorAll('[data-level]').forEach(b => b.addEventListener('click', () => startLevel(+b.dataset.level)));
    $('#verBtn').addEventListener('click', () => {
      modal(`<h3>What's new</h3><div class="changelog">${CHANGELOG.map(r => `<h4>v${r.v}<span>${r.date}</span></h4><ul>${r.notes.map(n => `<li>${n}</li>`).join('')}</ul>`).join('')}</div><div class="btnrow"><button class="btn primary" id="mClose">Close</button></div>`);
      $('#mClose').onclick = closeModal;
    });
    $('#resetBtn').addEventListener('click', () => {
      modal(`<h3>Reset all progress?</h3><p>Scores, completed lessons and unlocked missions will be erased in this browser.</p><div class="btnrow"><button class="btn" id="mNo">Cancel</button><button class="btn" id="mYes" style="background:var(--red-d);border-color:var(--red);color:var(--red)">Reset</button></div>`);
      $('#mNo').onclick = closeModal;
      $('#mYes').onclick = () => { progress = { lessons: {}, levels: {}, wrap: progress.wrap }; save(); closeModal(); renderHome(); };
    });
  }
  function showHome() {
    state.mode = null; closeModal(); leaveApp();
    $('#play').hidden = true; $('#home').hidden = false; renderHome(); window.scrollTo(0, 0);
  }

  /* ---------- PLAY ---------- */
  const state = { mode: null, idx: 0, step: 0, hints: 0, wrong: [], picked: null, solved: false };
  const panel = $('#panel');
  function enterPlay(title, chip) {
    enterApp();
    $('#home').hidden = true; $('#play').hidden = false;
    $('#playTitle').innerHTML = title;
    $('#scoreChip').innerHTML = chip || '';
    panel.classList.remove('collapsed'); updateToggle();
    applyWrap();
    term.attach(new Engine.Session(Engine.buildWorld()));
    panel.scrollTop = 0;
    setTimeout(() => { if (!isNarrow()) term.focus(); term.scroll(); }, 30);
  }
  function updateToggle() { $('#togglePanel').textContent = (state.mode === 'lesson' ? 'Lesson ' : 'Ticket ') + (panel.classList.contains('collapsed') ? '▸' : '▾'); }
  $('#togglePanel').addEventListener('click', () => { panel.classList.toggle('collapsed'); updateToggle(); });
  $('#backBtn').addEventListener('click', showHome);

  /* lessons */
  function startLesson(i) {
    Object.assign(state, { mode: 'lesson', idx: i, step: 0 });
    const l = LESSONS[i];
    enterPlay(`<span>T${String(i + 1).padStart(2, '0')} ·</span> ${esc(l.title)}`, `Training <b>${i + 1}</b>/${LESSONS.length}`);
    renderLesson();
  }
  function bindTypeit() {
    panel.querySelectorAll('.typeit').forEach(b => b.addEventListener('click', () => { term.input.value = b.dataset.cmd; term.caretEnd(); term.input.focus({ preventScroll: true }); }));
  }
  /* debrief list: the go-to command first, then common alternatives or follow-up steps */
  function howto(l) {
    if (!l.how || !l.how.length) return '';
    const go = isNarrow() ? 'tap to type' : 'click to type';
    return `<div class="howto"><div class="label">Commands that solve it</div>${l.how.map(([cmd, why]) =>
      `<button class="typeit" data-cmd="${esc(cmd)}"><span class="pr">$</span><span>${esc(cmd)}</span><span class="go">${go}</span></button>${why ? `<div class="why">${esc(why)}</div>` : ''}`).join('')}</div>`;
  }
  function renderLesson() {
    const l = LESSONS[state.idx];
    const n = l.steps.length, done = Math.min(state.step, n);
    let html = `<div class="lhead"><div class="kicker">Training ${state.idx + 1} of ${LESSONS.length} · step ${Math.min(done + 1, n)}/${n}</div><h2>${esc(l.title)}</h2><div class="bar"><i style="width:${done / n * 100}%"></i></div></div><ol class="steps">`;
    l.steps.forEach((s, k) => {
      if (k > state.step) return;
      const cls = k < state.step ? 'done' : 'cur';
      html += `<li class="step ${cls}" data-n="${k + 1}"><div>${s.text}</div>
        <button class="typeit" data-cmd="${esc(s.cmd)}"><span class="pr">$</span>${esc(s.cmd)}<span class="go">${isNarrow() ? 'tap to type' : 'click to type, then Enter'}</span></button>
        ${k < state.step ? `<div class="after">${s.after}</div>` : ''}</li>`;
    });
    html += '</ol>';
    if (state.step >= n) {
      const next = state.idx + 1 < LESSONS.length;
      html += `<div class="debrief"><h3>✓ Lesson complete</h3><p>${next ? 'Next up: <b>' + esc(LESSONS[state.idx + 1].title) + '</b>.' : 'Training finished. Time for real incidents.'} The terminal stays open if you want to keep exploring.</p>
        <div class="btnrow">${next ? '<button class="btn primary" id="nextLesson">Next lesson →</button>' : '<button class="btn primary" id="toMissions">Start mission 1 →</button>'}<button class="btn" id="toMenu">Menu</button></div></div>`;
    }
    panel.innerHTML = html;
    bindTypeit();
    const nl = $('#nextLesson'); if (nl) nl.onclick = () => startLesson(state.idx + 1);
    const tm = $('#toMissions'); if (tm) tm.onclick = () => startLevel(0);
    const mm = $('#toMenu'); if (mm) mm.onclick = showHome;
    const cur = panel.querySelector('.step.cur') || panel.querySelector('.debrief');
    if (cur) cur.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
  function lessonCheck(line, r) {
    const l = LESSONS[state.idx]; if (state.step >= l.steps.length) return;
    const s = term.session, f = s.frame;
    const info = { cmds: r.cmds, code: r.code, cwd: f.cwd, where: f.m.kind === 'host' ? 'host' : 'container', line, user: f.user };
    let ok = false;
    try { ok = l.steps[state.step].check(info); } catch (e) { ok = false; }
    if (!ok) return;
    state.step++;
    if (state.step >= l.steps.length) { progress.lessons[l.id] = true; save(); }
    renderLesson();
  }

  /* missions */
  const worth = () => Math.max(MIN_PTS, BASE - state.hints * HINT_COST - state.wrong.length * WRONG_COST);
  function startLevel(i) {
    if (!levelUnlocked(i)) return;
    Object.assign(state, { mode: 'level', idx: i, hints: 0, wrong: [], picked: null, solved: false });
    const l = LEVELS[i];
    enterPlay(`<span>M${String(i + 1).padStart(2, '0')} ·</span> ${esc(l.title)}`, `Score <b>${totalScore()}</b>`);
    renderLevel();
  }
  function renderLevel() {
    const l = LEVELS[state.idx]; const rec = progress.levels[l.id];
    const mono = l.options.every(o => /^[#\/\d.]|^\S+$/.test(o));
    let html = `<div class="ticket ${l.alert ? 'alert' : ''}">
      <div class="tk-head"><span class="prio ${l.prio}">${l.prio}</span><span class="id">INC-${2400 + state.idx * 7 + 3}</span><span>· ${esc(l.from)}</span></div>
      <h2>${esc(l.title)}</h2><p>${l.ticket}</p>
      <div class="tk-tag">mission ${state.idx + 1}/${LEVELS.length}${rec ? ' · best ' + rec.best + ' pts' : ''}${l.boss ? ' · final mission' : ''}</div></div>`;
    if (!state.solved) {
      html += `<div class="qbox" id="qbox"><div class="label"><span>Close the incident</span><span>worth <b id="worth">${worth()}</b> pts</span></div>
        <p class="qtext">${esc(l.question)}</p><div class="opts">${l.options.map((o, k) => {
          const cls = state.wrong.includes(k) ? 'wrong' : state.picked === k ? 'sel' : '';
          return `<button class="opt ${cls} ${mono ? 'mono' : ''}" data-k="${k}" ${state.wrong.includes(k) ? 'disabled' : ''}><span class="l">${'ABCD'[k]}</span><span class="v">${esc(o)}</span></button>`;
        }).join('')}</div>
        <button class="submit" id="submitBtn" ${state.picked === null ? 'disabled' : ''}>Submit answer</button>
        <div class="feedback" id="fb"></div></div>
        <div class="hints"><div class="label"><span>Hints</span><span>${state.hints}/${l.hints.length} used</span></div>
        <button class="hintbtn" id="hintBtn" ${state.hints >= l.hints.length ? 'disabled' : ''}>${state.hints >= l.hints.length ? 'No more hints' : `Show hint ${state.hints + 1} of ${l.hints.length} · −${HINT_COST} pts`}</button>
        <ol>${l.hints.slice(0, state.hints).map(h => `<li>${h}</li>`).join('')}</ol></div>
        <div class="note">Investigate in the terminal →  The server was reset for this mission.</div>`;
    } else {
      const pts = state.earned;
      html += `<div class="qbox"><div class="label"><span>Answer</span></div><p class="qtext">${esc(l.question)}</p>
        <div class="opts"><div class="opt right ${mono ? 'mono' : ''}"><span class="l">${'ABCD'[l.answer]}</span><span class="v">${esc(l.options[l.answer])}</span></div></div></div>
        <div class="debrief"><h3>✓ Resolved · +${pts} pts</h3><p>${l.debrief}</p>${howto(l)}<div class="btnrow">${state.idx + 1 < LEVELS.length ? '<button class="btn primary" id="nextLevel">Next mission →</button>' : ''}<button class="btn" id="replay">Replay</button><button class="btn" id="toMenu2">Menu</button></div></div>`;
    }
    panel.innerHTML = html;
    panel.querySelectorAll('.opt[data-k]').forEach(b => b.addEventListener('click', () => { state.picked = +b.dataset.k; renderLevel(); }));
    const sb = $('#submitBtn'); if (sb) sb.onclick = submitAnswer;
    const hb = $('#hintBtn'); if (hb) hb.onclick = () => { if (state.hints < l.hints.length) { state.hints++; renderLevel(); const ol = panel.querySelector('.hints ol'); if (ol) ol.lastElementChild.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } };
    bindTypeit();
    const nx = $('#nextLevel'); if (nx) nx.onclick = () => startLevel(state.idx + 1);
    const rp = $('#replay'); if (rp) rp.onclick = () => startLevel(state.idx);
    const tm = $('#toMenu2'); if (tm) tm.onclick = showHome;
  }
  function submitAnswer() {
    const l = LEVELS[state.idx]; if (state.picked === null) return;
    if (state.picked === l.answer) {
      state.solved = true; state.earned = worth();
      const prev = progress.levels[l.id];
      const best = Math.max(prev ? prev.best : 0, state.earned);
      progress.levels[l.id] = { best }; save();
      $('#scoreChip').innerHTML = `Score <b>${totalScore()}</b>`;
      renderLevel();
      const last = state.idx + 1 >= LEVELS.length;
      modal(`<div class="note">${last ? 'ALL INCIDENTS CLOSED' : 'INCIDENT RESOLVED'}</div><div class="big">+${state.earned}</div>
        <h3>${esc(l.title)}</h3><p>${last ? `Total score <b style="color:var(--text)">${totalScore()} / ${MAX_SCORE}</b>, rank <b style="color:var(--amber)">${rank(totalScore())}</b>. ` : ''}${state.hints ? state.hints + ' hint' + (state.hints > 1 ? 's' : '') + ' used. ' : 'No hints. '}${state.wrong.length ? state.wrong.length + ' wrong answer' + (state.wrong.length > 1 ? 's' : '') + '.' : 'First try!'} Read the debrief in the panel to see how a pro would have done it.</p>
        <div class="btnrow">${!last ? '<button class="btn primary" id="mNext">Next mission →</button>' : '<button class="btn primary" id="mMenu">Back to menu</button>'}<button class="btn" id="mStay">Read debrief</button></div>`);
      const mn = $('#mNext'); if (mn) mn.onclick = () => { closeModal(); startLevel(state.idx + 1); };
      const mm = $('#mMenu'); if (mm) mm.onclick = showHome;
      $('#mStay').onclick = () => { closeModal(); panel.classList.remove('collapsed'); updateToggle(); const d = panel.querySelector('.debrief'); if (d) d.scrollIntoView({ block: 'nearest' }); };
    } else {
      state.wrong.push(state.picked); state.picked = null;
      renderLevel();
      const q = $('#qbox'); q.classList.add('shake');
      const fb = $('#fb'); fb.className = 'feedback bad'; fb.textContent = `Not quite. −${WRONG_COST} pts. Keep digging in the terminal.`;
    }
  }

  term.onRun = (line, r) => { if (state.mode === 'lesson') lessonCheck(line, r); };
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) closeModal(); });
  window.addEventListener('resize', () => { if (state.mode === 'lesson') { /* keep tap labels right */ } });

  showHome();

  /* installable app + offline play when hosted as a site (not inside a sandboxed frame) */
  try {
    if ('serviceWorker' in navigator && window.self === window.top && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  } catch (e) { /* not available here */ }
})();
</script>
</body>
</html>
